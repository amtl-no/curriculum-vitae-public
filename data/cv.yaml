representation:
  - id: exep
    title:
      nb: Norsk representant, Expert Group on e-Procurement (EXEP)
      en: Norwegian Representative, Expert Group on e-Procurement (EXEP)
    organisation: *dfo
    start:
      year: 2025
      month: 3
    end: ~
    visible: true
    details:
      nb: >-
        Representerer Norge i EU-kommisjonens ekspertgruppe for
        digitalisering av offentlige anskaffelser. Fremlegger norske
        posisjoner og faglige funn for gruppen, og formidler
        EU-utviklinger tilbake til norske fagmiljøer. Deltatt i
        arbeidsgrupper i Brüssel og ved EU-kommisjonens kontor i
        Luxembourg, inkludert samarbeid med ontologigruppen om
        datamodellering for det komplette bildet av offentlige
        anskaffelser, fra planlegging til gjennomføring og
        oppfølging.
      en: >-
        Represents Norway in the European Commission's expert group
        on the digitalisation of public procurement. Presents
        Norwegian positions and findings to the group, and
        communicates EU developments back to Norwegian stakeholders.
        Participated in working groups in Brussels and at the
        Commission's office in Luxembourg, including collaboration
        with the ontology group on data modelling for the complete
        picture of public procurement — from planning through
        execution to follow-up.
