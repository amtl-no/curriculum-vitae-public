      en: Alnabru, Norway
    start:
      year: 2011
      month: 6
    end:
      year: 2018
      month: 6
    bullets:
      nb:
        - >-
          Registrerte og vurderte import- og eksportsendinger etter norske
          tollregler; behandlet restriksjonsbelagte forsendelser, og
          utførte fortollinger.
      en:
        - >-
          Registered and assessed import and export shipments under
          Norwegian customs regulations; processed restricted shipments
          and performed customs clearance.

