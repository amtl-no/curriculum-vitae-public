    title:
      nb: Fast medlem, Teknologirådet
      en: Permanent Member, Technology Advisory Board
    organisation: *dfo
    start:
      year: 2026
      month: 2
    end: ~
    visible: true
    details:
      nb: >-
        Teknologistrategi, interne konsultasjoner og evaluering av
        verktøy og teknologier for direktoratet. Faglig ressurs i
        strategiske diskusjoner, utarbeider anbefalinger
        til styret om teknologivalg og fremtidig retning.
      en: >-
        Technology strategy, internal consultations, and evaluation of
        new tools and technologies for the agency. Contributes as the
        subject matter expert in strategic discussions and prepares
        recommendations to the board on technology choices and future
        direction.

