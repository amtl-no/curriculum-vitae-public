          billeddatasett.
      en:
        - >-
          Participated in electro-optical measurement campaigns in the
          field. Analysed thermal (near-infrared) and multispectral image
          datasets.
  - id: posten
    title:
      nb: Sesongvikar
      en: Seasonal Worker
    employer: *posten
    location:
