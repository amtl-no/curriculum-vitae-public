profile:
  nb: >-
    Sivilingeniør med fysikkbakgrunn, med bakgrunn fra eksperimentelle
    systemer der målinger uten stringens er meningsløse og resultater må
    være reproduserbare for å være interessante. Anvender nå den samme
    disiplinen på dataplattformer og analytiske pipelines — fra
    datamodellering til produksjonssetting. Bringer en ingeniørs instinkt
    for å bygge systemer som er robuste ved design fremfor korrekte ved en 
    tilfeldighet. Søker roller der disse prinsippene anvendes på 
    datainfrastruktur hvor korrekthet og sporbarhet er ikke-forhandlbare 
    krav.
  en: >-
    An MSc physicist from NTNU — where measurement without rigour is
    meaningless and results that cannot be reproduced are uninteresting
    — now applying that same discipline on data platforms and analytics
    pipelines, from data modelling to production. Brings an engineer's
    instinct for building systems that are robust by design rather than
    correct by luck. Looking to apply these principles to data
    infrastructure where correctness and auditability are non-negotiable.

