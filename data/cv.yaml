experience:
  - id: dfo
    title:
      nb: Seniorrådgiver
      en: Senior Advisor
    subtitle:
      nb: Dataanalytiker, Avdeling for styring og digitalisering
      en: Data Analyst, Department for Governance and Digitalisation
    employer: *dfo
    location:
      nb: Oslo, Norge
      en: Oslo, Norway
    start:
      year: 2024
      month: 11
    end: ~
    bullets:
      nb:
        - >-
            Gjenoppbygde direktoratets analytiske fundament for offentlige
            anskaffelser. Erstattet et feilbeheftet ad hoc-API med direkte
            uttrekk av informasjon fra eForms-XML-data ved hjelp av
            mellomliggende datatransformasjon til RDF etter EU-kommisjonens
            metodikk. Strukturerte de nøstede anskaffelsesdataene
            som en relasjonsmodell tilrettelagt for forretningsanalyse,
            inkludert en dobbel stjerne-semantisk modell i Power BI.
        - >-
            Bygget hele det nevnte analytiske fundamentet alene i løpet av
            noen måneder. Plattformen analyserer alle publiserte
            eForms-kunngjøringer om offentlige anskaffelser i Norge. Finske
            fagfeller som vurderte modellen og metodikken satte av et 
            dedikert team for å replikere den.
        - >-
            Primær pådriver for dev/test/produksjons-miljødisiplin på tvers
            av alle analytiske leveranser — Power BI-semantiske modeller,
            datapipelines og LLM-arbeidsflyter vedlikeholdes hver for seg i
            dedikerte arbeidsområder via CI/CD, innenfor direktoratets
            Azure-lakehouse-arkitektur.
        - >-
            Mestret, utvidet og robustifiserte organisasjonens
            LLM-analysepipeline — anvendte den på nye fagområder,
            dekomponerte komplekse systemprompt til kjedede delprompt,
            erstattet JSON med XML som mellomliggende datautvekslingsformat
            for økt robusthet og mer deterministisk analysestrøm gjennom
            prosesserings-pipelinen. Utformet relasjonsbaserte utdatamodeller
            for strukturerte analyseresultater.
        - >-
            Designet og bygget en CI/CD-pipeline for innebygging av
            sammensatte Power BI-rapporter via tokenbasert autentisering,
            noe som muliggjør skalerbar flermodellrapportering
            i produksjon.
        - >-
            Domeneekspert for den norske eForms-SDKens XPath-valideringslag
            — utformer regler som håndhever samsvar med nasjonalt
            anskaffelsesregelverk og datakvalitetskrav, og bygger bro
            mellom Norges SDK-utvidelser og byggeprosessen for
            oppstrøms-SDKen slik den defineres og vedlikeholdes av
            EU-kommisjonen.
        - >-
            Formidler analytiske funn til ledelse gjennom tekniske
            rapporter og notater, og publiserer data eksternt på
            offentlig tilgjengelige nettsider. Betjener også eksterne
            dataforespørsler utover det som presenteres i dashbord,
            i form av tilpassede uttrekk og leveranser. Aktivitetene
            er forankret i direktoratets årlige tildelingsbrev.
      en:
        - >-
            Rebuilt the agency's public procurement analytics foundation.
            Replaced an erroneous ad hoc API with direct extraction of
            information from eForms XML data using intermediate data
            transformation to RDF mirroring European Commission
            methodology. Structured the nested public procurement data as
            a relational model conducive for business analytics, including
            a double snowflake semantic model in Power BI.
        - >-
            The aforementioned analytics foundation was built as a solo
            effort in a matter of months. The platform analyses all published
            eForms notices on public procurement in Norway. Finnish
            counterparts who reviewed the model and methodology assigned a
            dedicated team to replicate it.
        - >-
            Primary driver of dev/test/production environment discipline
            across all analytics deliverables. Power BI semantic models,
            data pipelines, and LLM workflows are each maintained across
            dedicated workspaces via CI/CD, within the agency's Azure
            lakehouse architecture.
        - >-
            Mastered, extended, and hardened the organisation's LLM
            analysis pipeline — applying it to new subject matter,
            decomposing complex system prompts into chained sub-prompts,
            replacing JSON with XML as the intermediate exchange format
            for robustness and a more deterministic analysis flow through
            the processing pipeline. Designed relational output models for
            structured analysis results.
        - >-
            Designed and built a CI/CD pipeline for composite Power BI
            report embedding via token-based authentication, enabling
            scalable multi-model reporting in production.
        - >-
            Domain lead for the Norwegian eForms SDK's XPath validation
            layer, authoring rules enforcing compliance with national
            procurement regulations and data quality constraints,
            bridging Norway's SDK extensions with the upstream
            European Commission build.
        - >-
            Communicates analytical findings to management through
            technical briefs and reports, and publishes data externally
            on publicly accessible websites. Serves external data
            requests beyond published dashboards through tailored
            extracts and deliveries. Activities are formally mandated
            through the agency's annual letter of assignment.
    visible: true
  - id: ffi
    title:
      nb: Forsker
      en: Scientific Researcher
    employer: *ffi
    location:
      nb: Kjeller, Norge
      en: Kjeller, Norway
    start:
      year: 2018
      month: 8
    end:
      year: 2024
      month: 11
    bullets:
      nb:
        - >-
            Konstruerte en 1.5 kW Ytterbium-fiberlaser konfigurert
            for koherent strålekombinering, inklusive FPGA-basert
            signalbehandling for en
            strålekombinerings-tilbakekoblingssløyfe basert på
            programvaredefinerte radioer.
        - >-
            Designet fullautomatiserte og repeterbare eksperimentelle
            arbeidsflyter på tvers av laserlaboratoriet — fjernstyrt
            instrumentering, skreddersydde maskinvaregrensesnitt,
            kretskort, Teensy-programvare, og 3D-printede komponenter.
            Omgikk nettverksbegrensninger ved hjelp av maskinvarebaserte
            løsninger for å muliggjøre fjernstyring fra dedikerte
            arbeidsstasjoner per optiske bord.
        - >-
            Reverskonstruerte en Japansk C#-programvaresuite for
            en fiberfusjonsspleiser for å utvide dens aktive
            opplinjeringsrutine basert på eksterne lyseffektmålinger —
            dette muliggjorde å bruke effektavlesninger fra vilkårlige
            lasereffektmålere via et tilpasset grensesnitt, og å omgå
            det GPIB-baserte utstyret spleisemaskinfabrikanten ellers
            påtrykte.
        - >-
            Utviklet skreddersydde programvaregrensesnitt mot
            måleinstrumenter i Python og C#, som supplement til
            eller erstatning for leverandørenes egne APIer der
            disse var utilstrekkelige eller fraværende.
        - >-
            Utførte kvalifiseringstesting av lasersystemer mot
            sikkerhetsstandarder — alene eller i par med en annen
            vitenskapelig kollega — på tvers av en rekke plattformer,
            inkludert håndholdt, våpenmontert og helikopter- eller
            flymontert utstyr, både i laboratoriet og i felten.
        - >-
            Samarbeidet med eksterne industripartnere, herunder blant
            annet Nammo og Kongsberg, om bruksområder for lasersystemer.
            Utarbeidet interne tekniske rapporter og bidro til faglig
            formidling på tvers av organisasjonsgrenser.
      en:
        - >-
            Constructed a 1.5 kW Ytterbium fibre laser configured for
            coherent beam combination, including FPGA-based signal
            processing for software-defined radio approaches to the
            combination feedback loop.
        - >-
            Engineered fully automated, repeatable experimental workflows
            across the laser lab — remote-controlled instrumentation,
            custom hardware interfaces, circuit boards, Teensy firmware,
            and 3D-printed components. Circumvented network restrictions
            through hardware workarounds enabling remote operation from
            dedicated per-table workstations.
        - >-
            Reverse-engineered a Japanese C# control suite for a fusion
            splicer to extend its power meter alignment capability —
            injecting readings from arbitrary power meters via a custom
            interface, bypassing the out-of-box GPIB device lock-in.
        - >-
            Developed custom software interfaces to measurement
            instruments in Python and C#, supplementing or replacing
            vendor-supplied APIs where these were insufficient or
            absent.
        - >-
            Performed qualification testing of laser systems against safety
            standards — sole or paired researcher — across a range of
            platforms including hand-held, weapon-mounted, and helicopter-
            or airplane-mounted equipment, both in-lab and in the field.
        - >-
            Collaborated with external industrial partners including
            Nammo and Kongsberg on use cases for laser systems. Produced
            internal technical reports and contributed to knowledge
            transfer across organisational boundaries.
    visible: true
