%YAML 1.2
# yamllint disable rule:line-length
# SPDX-License-Identifier: CC-BY-4.0
# SPDX-FileCopyrightText: 2026 Arne Magnus Tveita Løken <212174338+amtl-no@users.noreply.github.com>
# yamllint enable rule:line-length
#
# Sourced directly from moderncvcolor*.sty and moderncvstyle*.sty.
# color1_rgb: accent colour (headings, rules, links)
# color2_rgb: secondary colour (subheadings, body details)
---
styles:
  - casual
  - classic
  - banking
  - oldstyle
  - fancy
  - empty

palettes:
  blue:
    color1_rgb: '0.22,0.45,0.70'
    color2_rgb: '0.45,0.45,0.45'
  orange:
    color1_rgb: '0.95,0.55,0.15'
    color2_rgb: '0.45,0.45,0.45'
  green:
    color1_rgb: '0.35,0.70,0.30'
    color2_rgb: '0.45,0.45,0.45'
  red:
    color1_rgb: '0.95,0.20,0.20'
    color2_rgb: '0.45,0.45,0.45'
  purple:
    color1_rgb: '0.50,0.33,0.80'
    color2_rgb: '0.45,0.45,0.45'
  grey:
    color1_rgb: '0.55,0.55,0.55'
    color2_rgb: '0.55,0.55,0.55'
  burgundy:
    color1_rgb: '0.596078,0,0'
    color2_rgb: '0.45,0.45,0.45'
  black:
    color1_rgb: '0,0,0'
    color2_rgb: '0,0,0'
