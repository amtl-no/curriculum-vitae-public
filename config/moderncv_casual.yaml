%YAML 1.2
# yamllint disable rule:line-length
# SPDX-License-Identifier: CC-BY-4.0
# SPDX-FileCopyrightText: 2026 Arne Magnus Tveita Løken <212174338+amtl-no@users.noreply.github.com>
# yamllint enable rule:line-length
---
meta:
  license:
    spdx: CC-BY-4.0
  description: Moderncv casual theme configuration

template: moderncv/cv.tex.j2

documentclass:
  name: moderncv
  options:
    - a4paper
    - 11pt

packages:
  - name: geometry
    options:
      top: 1in
      bottom: 1in
      left: 1in
      right: 1in
  - name: babel
    options:
      lang: true
  - name: csquotes
  - name: fontspec
  - name: xurl
  - name: nowidow

theme:
  style: casual
  color: blue

pre_commands:
  # urlcolor derived from theme.color via MODERNCV_PALETTES in render.py
  - \PassOptionsToPackage{colorlinks=true,urlcolor=[rgb]{{color1_rgb}}}{hyperref}

commands:
  - \recomputelengths
  - \setlength{\footskip}{57pt}
  - \setmainfont{Source Serif Pro}
  - \moderncvtheme[{color}]{{style}}
  - \patchcmd{\makeletterclosing}{[3em]}{[1em]}{}{}
